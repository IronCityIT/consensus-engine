name: AI Consensus Analysis

# ============================================================
# The single source of truth for AI analysis across every ICIT product.
# Products call this via `workflow_call` and never duplicate LLM logic.
#
# Result delivery is caller's choice:
#   consensus_b64 output  -> caller stores it (e.g. storeScanResults -> Firestore)
#   post_to_api: true     -> engine POSTs it to the ingest API itself (legacy path)
# Callers handling regulated scan data set `post_to_api: false` and store the
# output themselves, so findings never leave the Firestore path.
# ============================================================

on:
  workflow_call:
    inputs:
      findings_json:
        description: 'Base64 encoded JSON findings'
        required: true
        type: string
      product:
        description: 'Product name'
        type: string
        default: 'generic'
      client_id:
        description: 'Client ID'
        type: string
        default: 'default'
      scan_id:
        description: 'Scan ID to update'
        type: string
        default: ''
      api_url:
        description: 'Ingest API URL (only used when post_to_api is true)'
        type: string
        default: 'https://api.ironcityit.com/ingest'
      post_to_api:
        description: >-
          POST the consensus result to the ingest API. Default true preserves
          existing caller behaviour. Set false when the caller stores the
          result itself and the data must not leave the Firestore path.
        type: boolean
        default: true
    outputs:
      consensus_b64:
        description: 'Base64-encoded consensus result JSON (empty if analysis failed)'
        value: ${{ jobs.analyze.outputs.consensus_b64 }}
    secrets:
      GROQ_API_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: true
      GEMINI_API_KEY:
        required: true
      IRONCITY_API_KEY:
        # Only needed when post_to_api is true. Callers that store the result
        # themselves no longer have to hold this key at all.
        required: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      consensus_b64: ${{ steps.consensus.outputs.consensus_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: IronCityIT/consensus-engine

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run Consensus Engine
        id: consensus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINDINGS_B64: ${{ inputs.findings_json }}
          PRODUCT: ${{ inputs.product }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          printf '%s' "$FINDINGS_B64" | base64 -d > /tmp/findings.json
          python src/consensus_engine.py /tmp/findings.json \
            -p "$PRODUCT" \
            -c "$CLIENT_ID" \
            -o /tmp/result.json --pretty
          echo "=== AI CONSENSUS RESULT ==="
          cat /tmp/result.json
          # Handed back to the caller so it can store the result on its own
          # path. This is what makes post_to_api:false a real option rather
          # than a way to silently discard the analysis.
          echo "consensus_b64=$(base64 -w0 /tmp/result.json)" >> "$GITHUB_OUTPUT"

      - name: Update scan in ingest API
        if: inputs.scan_id != '' && inputs.post_to_api
        env:
          API_KEY: ${{ secrets.IRONCITY_API_KEY }}
          API_URL: ${{ inputs.api_url }}
          SCAN_ID: ${{ inputs.scan_id }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::post_to_api is true but IRONCITY_API_KEY was not provided"
            exit 1
          fi
          jq --arg sid "$SCAN_ID" \
             '{scan_id: $sid, ai_consensus: .}' /tmp/result.json > /tmp/update.json

          curl -sS --fail-with-body -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d @/tmp/update.json

          echo "✅ AI consensus posted to ingest API"

      - name: Note result delivery
        if: inputs.scan_id == '' || !inputs.post_to_api
        run: |
          echo "Ingest-API POST skipped; consensus returned to caller via consensus_b64."
