name: AI Consensus Analysis

on:
  workflow_call:
    inputs:
      findings_json:
        description: 'Base64 encoded JSON findings'
        required: true
        type: string
      product:
        description: 'Product name'
        type: string
        default: 'generic'
      client_id:
        description: 'Client ID'
        type: string
        default: 'default'
      scan_id:
        description: 'Scan ID to update'
        type: string
        default: ''
      api_url:
        description: 'QNAP API URL'
        type: string
        default: 'https://api.ironcityit.com/ingest'
    secrets:
      # Optional on purpose — see the note in the analyze job. A missing key
      # degrades AI enrichment; it does not fail the calling product's scan.
      GROQ_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      IRONCITY_API_KEY:
        required: false

jobs:
  analyze:
    name: AI Consensus Analysis
    runs-on: ubuntu-latest
    # Least privilege: the reusable engine reads its own repo and posts results
    # onward; it needs no write access to the calling repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: IronCityIT/consensus-engine

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install --quiet requests

      # Caller-supplied values reach the engine through env, never interpolated
      # into the script body. findings_json is base64; product/client_id are
      # passed as argv, so a value with shell metacharacters cannot execute.
      - name: Run Consensus Engine
        id: consensus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINDINGS_JSON: ${{ inputs.findings_json }}
          PRODUCT: ${{ inputs.product }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          # A malformed base64 payload is a caller error, not an engine crash —
          # fail with a clear message instead of feeding garbage to the parser.
          if ! printf '%s' "$FINDINGS_JSON" | base64 -d > /tmp/findings.json 2>/dev/null; then
            echo "::error::findings_json is not valid base64"
            exit 1
          fi
          if ! python3 -m json.tool /tmp/findings.json > /dev/null 2>&1; then
            echo "::error::decoded findings_json is not valid JSON"
            exit 1
          fi
          python src/consensus_engine.py /tmp/findings.json \
            -p "$PRODUCT" \
            -c "$CLIENT_ID" \
            -o /tmp/result.json --pretty
          # The engine must produce parseable output for the downstream update.
          if ! python3 -m json.tool /tmp/result.json > /dev/null 2>&1; then
            echo "::error::consensus engine did not produce valid result JSON"
            exit 1
          fi
          echo "=== AI CONSENSUS RESULT ==="
          cat /tmp/result.json

      # Result is exposed as an artifact so a caller (or an operator) can retrieve
      # the consensus output. This is additive — it changes no existing input or
      # secret, so every current caller keeps working unchanged.
      - name: Upload consensus result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-result-${{ inputs.scan_id || github.run_id }}
          path: /tmp/result.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Update scan in QNAP
        if: inputs.scan_id != ''
        env:
          API_KEY: ${{ secrets.IRONCITY_API_KEY }}
          API_URL: ${{ inputs.api_url }}
          SCAN_ID: ${{ inputs.scan_id }}
        run: |
          set -euo pipefail
          # IRONCITY_API_KEY is optional; without it, skip the post rather than
          # failing the run on an inevitable auth rejection.
          if [ -z "${API_KEY:-}" ]; then
            echo "::warning::IRONCITY_API_KEY not set — skipping QNAP update"
            exit 0
          fi
          # scan_id via --arg (env), never interpolated into the jq program.
          jq --arg sid "$SCAN_ID" \
             '{scan_id: $sid, ai_consensus: .}' /tmp/result.json > /tmp/update.json

          # -s hid transport errors; check the HTTP code so a rejected update is
          # a real failure rather than a silent success.
          HTTP_CODE=$(curl -sS -o /tmp/qnap-response.txt -w '%{http_code}' -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_KEY" \
            -d @/tmp/update.json)
          echo "QNAP responded HTTP $HTTP_CODE"
          cat /tmp/qnap-response.txt || true
          case "$HTTP_CODE" in
            2*) echo "AI consensus posted to QNAP" ;;
            *)  echo "::error::QNAP update rejected (HTTP $HTTP_CODE)"; exit 1 ;;
          esac
